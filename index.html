<!DOCTYPE html>
<html>
    <head>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

        <style>
            .carousel-item img{
    height: 500px;
    object-fit: cover;
}
            </style>
    </head>
    <body onload="generateCards()">
        <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#"> Sweet Treats </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="#">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#"> Menu </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Cart</a>
        </li>
        <li class="nav-item">
          <a class="nav-link">Checkout</a>
        </li>
      </ul>
    </div>
  </div>
</nav>
        <!-- image overlay starts here -->
        <div class="card text-bg-dark">
  <img src="https://tse1.mm.bing.net/th/id/OIP.lolvwIgEknsXfHTcaFAlSgHaE8?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" class="card-img" alt="...">
  <div class="card-img-overlay d-flex justify-content-center align-items-center flex-column">
    <h5 class="card-title"> Welcome To Sweet Treats </h5>
    <p class="card-text"> Your Destination for desserts and beverages</p>
  </div>
</div>
        <!-- card -->
        <div class="container my-5" id="menu">
            <div class="row" id="itemscontainer">
            </div>
        </div>
        <!-- carasoul -->
        <footer> 
            <div class="container text-center">
                <h2> Our Products </h2>
                <div id="carouselExample" class="carousel slide">
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="https://static.vecteezy.com/system/resources/previews/063/152/398/large_2x/assortment-of-colorful-candy-chocolate-bars-with-vivid-colors-and-a-sweet-taste-4kgraphy-photo.jpeg" class="d-block w-100" alt="...">
    </div>
    <div class="carousel-item">
      <img src="https://tse3.mm.bing.net/th/id/OIP.fLP_yLSkDiXJKolfH-Vf-gHaHa?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" class="d-block w-100" alt="...">
    </div>
    <div class="carousel-item">
      <img src="https://static.vecteezy.com/system/resources/previews/032/932/859/non_2x/a-festive-table-of-baked-goods-in-various-shapes-and-color-free-photo.jpg" class="d-block w-100" alt="...">
    </div>
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
</div>
            </div>
        </footer>
        <!-- javascript -->
        <script>
            let items = [
                {
            name: "Ice Cream",
            description: "Creamy and delicious ice cream in various flavors.",
            price: 5.99,
            image: "https://images.unsplash.com/photo-1497034825429-c343d7c6a68f"
        },
        {
            name: "Cake",
            description: "Delectable cakes for all occasions.",
            price: 29.99,
            image: "https://images.unsplash.com/photo-1542826438-bd32f43d626f"
        },
        {
            name: "Mocktail",
            description: "Non-alcoholic mocktails bursting with flavors.",
            price: 3.99,
            image: "https://images.unsplash.com/photo-1556679343-c7306c1976bc"
        }
    ];

            function generateCards(){
                let container = document.getElementById("itemscontainer");
                container.innerHTML = "";

                for(let i = 0; i < items.length; i++){
                    container.innerHTML += `
                    <div class = "col-md-4 mb-4">
                    <div class = "card shadow">
                    <img src = "${items[i].image}" class = "card-img-top">
                    <div class = "card-body">
                    <h5> ${items[i].name}</h5>
                    <p> ${items[i].description}</p>
                    <p> $${items[i].price}</p>
                    <button class = "btn btn-primary" onclick = "addToCart('${items[i].name}')"> Add To Cart </button>
                    </div>
                    </div>
                    </div>
                    `
                }
            }

            function addToCart(itemName){
                alert(itemName +" Added To The Cart ");
            }

        </script>
    </body>
</html>
